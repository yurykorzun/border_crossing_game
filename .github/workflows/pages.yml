name: Deploy to GitHub Pages

# The game lives on worktree-prototype until it is merged, so that branch deploys too.
on:
  push:
    branches: [main, worktree-prototype]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # tools/tabletop.test.ts prints the tabletop PDF through Playwright's Chromium.
      - run: npx playwright install --with-deps chromium
      # The sweep and the walk run in their own jobs below, so each gets a whole runner.
      - run: npx vitest run --exclude tools/sweep.test.ts --exclude src/game/walk.test.ts
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # tools/sweep.test.ts on its own runner with every core (SWEEP_ALONE), because
  # beside the other test files on 2 of the 4 cores it went past its time limits
  # (run 43244109250). Same levels, seeds, styles, ceiling and limits.
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run tools/sweep.test.ts
        env:
          SWEEP_ALONE: '1'

  # src/game/walk.test.ts on its own runner for the same reason: beside the other
  # test files the 3-destination walk took 150 s against its 120 s limit (run 44733297576).
  walk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run src/game/walk.test.ts

  deploy:
    needs: [build, sweep, walk]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
