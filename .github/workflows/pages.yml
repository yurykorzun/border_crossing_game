name: Deploy to GitHub Pages

# The game lives on worktree-prototype until it is merged, so that branch deploys too.
on:
  push:
    branches: [main, worktree-prototype]
  # A PR runs the tests too, so a broken job shows before the merge rather than as a failed deploy.
  pull_request:
    branches: [main, worktree-prototype]
  workflow_dispatch:

# Only deploy gets the Pages and OIDC tokens, because the test jobs also run a PR's code.
permissions:
  contents: read

# A PR run gets its own group, because sharing `pages` would cancel a deploy in progress.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # tools/tabletop.test.ts prints the tabletop PDF through Playwright's Chromium.
      - run: npx playwright install --with-deps chromium
      # The sweep and the walk run in their own jobs below, so each gets a whole runner.
      - run: npx vitest run --exclude tools/sweep.test.ts --exclude src/game/walk.test.ts
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  # tools/sweep.test.ts on its own runner with every core (SWEEP_ALONE), because
  # beside the other test files on 2 of the 4 cores it went past its time limits
  # (run 43244109250). Same levels, seeds, styles, ceiling and limits.
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run tools/sweep.test.ts
        env:
          SWEEP_ALONE: '1'

  # src/game/walk.test.ts on its own runner, because beside the other test files the
  # 3-destination walk took 150 s (run 44733297576). Its 120 s limit is checked only
  # with WALK_ALONE=1, so here the job prints the time and fails only on a real problem.
  walk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # --silent=false, because vitest hides a passing test's output and the walk prints its time.
      - run: npx vitest run src/game/walk.test.ts --silent=false

  deploy:
    needs: [build, sweep, walk]
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
